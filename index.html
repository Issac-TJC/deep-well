<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Depth of the Well - BOSS (Modular Architecture)</title>

    <link rel="stylesheet" href="entities/boss/boss.css">
    <link rel="stylesheet" href="mobile/mobile.css">
    <link rel="stylesheet" href="render/renderer.css">

<body>

    <div id="game-container">
        <div id="ui-layer">Initialize...</div>
        <canvas id="gameCanvas"></canvas>

        <div id="mobile-controls">
            <div id="joystick-base" class="control-group">
                <div id="joystick-knob"></div>
            </div>
            <div id="actions" class="control-group">
                <div class="touch-btn" id="btn-interact">E</div>
                <div class="touch-btn" id="btn-map">MAP</div>
                <div class="touch-btn" id="btn-jump">JUMP</div>

        </div>

    <!-- Room Design -->
    <script src="world/world_data/rooms.js"></script>
    <script src="world/world_data/room_ability.js"></script>
    <script src="world/world_data/params.js"></script>
    <script src="world/world_data/tile.js"></script>
    <script src="world/tileInteraction.js"></script>

    <script src="render/renderer.js"></script>
    <script src="render/bg_effect.js"></script>
    <script src="render/bg_image.js"></script>

    <!-- Sounds -->
    <script src="systems/audioManager.js"></script>

    <!-- Core Engine Scripts -->
    <script src="core/script_base.js"></script>
    <script src="entities/boss/boss.js"></script>
    <script src="entities/boss/boss_visuals.js"></script>
    <script src="world/roomscripts.js"></script>

    <!-- 
    ============================================================================
    REFACTORED ENGINE MODULES
    ============================================================================
-->

    <script src="physics/physics.js"></script>
    <script src="entities/player.js"></script>
    <script src="world/map.js"></script>
    <script src="systems/systems.js"></script>
    <script src="core/game.js"></script>

    <!--mobile-->
    <script src="mobile/mobile.js"></script>

</html>
