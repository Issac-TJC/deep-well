<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Depth of the Well - BOSS (Modular Architecture)</title>

    <link rel="stylesheet" href="entities/boss/boss.css">
    <link rel="stylesheet" href="mobile/mobile.css">
    <link rel="stylesheet" href="render/renderer.css">

</head>

<body>

    <div id="game-container">
        <div id="ui-layer">Initialize...</div>
        <canvas id="gameCanvas"></canvas>
        <div class="scanlines"></div>
        <div class="vignette"></div>

        <!-- Save/Load UI -->
        <div id="save-load-ui" style="position: absolute; top: 10px; right: 10px; z-index: 1000;">
            <button id="btn-save"
                style="background:rgba(0,0,0,0.5); color:#fff; border:1px solid #777; padding:5px 10px; cursor:pointer; font-family: monospace;">Save
                JSON</button>
            <label for="btn-load"
                style="background:rgba(0,0,0,0.5); color:#fff; border:1px solid #777; padding:5px 10px; cursor:pointer; margin-left:5px; font-family: monospace;">Load
                JSON</label>
            <input type="file" id="btn-load" accept=".json" style="display:none;">
        </div>

        <!-- Mobile Controls UI -->
        <div id="mobile-controls">
            <div id="joystick-base" class="control-group">
                <div id="joystick-knob"></div>
            </div>
            <div id="actions" class="control-group">
                <div class="touch-btn" id="btn-interact">E</div>
                <div class="touch-btn" id="btn-map">MAP</div>
                <div class="touch-btn" id="btn-jump">JUMP</div>
            </div>
        </div>
    </div>

    <!-- Data & Managers -->
    <script src="core/events.js"></script>
    <script src="core/dataManager.js"></script>
    <script src="core/saveManager.js"></script>
    <script src="world/world_data/params.js"></script>
    <script src="world/world_data/tile.js"></script> <!-- Rendering specifics -->
    <script src="world/tileInteraction.js"></script> <!-- Registration logic -->

    <!-- Rendering Engine Scripts -->
    <script src="render/renderer.js"></script>
    <script src="render/bg_effect.js"></script>
    <script src="render/bg_image.js"></script>

    <!-- Sounds -->
    <script src="systems/audioManager.js"></script>

    <!-- Core Engine Scripts -->
    <script src="core/script_base.js"></script>
    <script src="entities/boss/boss.js"></script>
    <script src="entities/boss/boss_visuals.js"></script>
    <script src="world/roomscripts.js"></script>

    <!-- 
    ============================================================================
    REFACTORED ENGINE MODULES
    ============================================================================
-->

    <script src="entities/entities.js"></script>
    <script src="physics/physics.js"></script>
    <script src="entities/player.js"></script>
    <script src="world/map.js"></script>
    <script src="systems/systems.js"></script>
    <script src="core/game.js"></script>

    <!--mobile-->
    <script src="mobile/mobile.js"></script>

</body>

</html>
