<script>
/**
 * ============================================================================
 * 1. CONFIGURATION & REGISTRY (The "Engine Core")
 * ============================================================================
 */
const GAME_WIDTH = 480;
const GAME_HEIGHT = 288;
const TILE_SIZE = 16;
const SCALE = 2;

const COLORS = {
    bg: '#090914',
    tileDark: '#111122',
    tileLight: '#222238',
    tileHighlight: '#333355',
    grass: '#2a2a4a', 
    grassTip: '#4a4a7a',
    flowerStem: '#446644',
    flowerBulbClosed: '#444466',
    flowerBulbOpen: '#aa88ff',
    waterBase: 'rgba(20, 40, 100, 0.4)',
    waterSurface: 'rgba(50, 100, 255, 0.6)',
    playerCore: '#ffffff',
    playerGlow: '#aaffaa',
    hat: '#ffcc00',          
    hatLight: '#ffeedd',     
    mapBg: 'rgba(0, 0, 0, 0.85)',
    mapVisited: '#444466',
    mapCurrent: '#aaffaa',
    mapWall: '#666688',   
    mapWater: '#4444ff',
    chestClosed: '#d4af37',
    chestOpen: '#8a6e26',
    ladder: '#444455',
    lightBase: '#333344',
    lightGlow: '#ffeedd',
    spike: '#666677', 
    spikeDark: '#444455',
    // REFACTORED: Darker wood colors to blend into environment
    woodDark: '#2a1e19',   // Very dark brown shadow
    woodLight: '#4e3b31',  // Muted dark brown
    woodDetail: '#3a2a24'  // Detail shade
};

function rand(min, max) { return Math.random() * (max - min) + min; }
function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

// --- 1.1 TILE DEFINITIONS ---
const COLLISION_TYPE = {
    NONE: 0,
    SOLID: 1,
    ONE_WAY: 2,
    LIQUID: 3,
    CLIMBABLE: 4,
    HAZARD: 5
};

const RENDER_STYLE = {
    INVISIBLE: 0,
    BLOCK_BASIC: 1,
    LIQUID: 2,
    LADDER: 3,
    PLATFORM_WOOD: 4,
    SPIKE_ROCK: 5,
    OBJECT_MARKER: 6
};

// Central Registry
// Attribute `isVoid`: If true, adjacent solid blocks will draw edges against this tile.
const TILE_DEF = {
    0:  { name: "Air",           col: COLLISION_TYPE.NONE,      ren: RENDER_STYLE.INVISIBLE,    isVoid: true },
    1:  { name: "Dirt",          col: COLLISION_TYPE.SOLID,     ren: RENDER_STYLE.BLOCK_BASIC },
    2:  { name: "Water",         col: COLLISION_TYPE.LIQUID,    ren: RENDER_STYLE.LIQUID,       friction: 0.9, gravityMod: 0.5, isVoid: true },
    3:  { name: "ChestNode",     col: COLLISION_TYPE.NONE,      ren: RENDER_STYLE.OBJECT_MARKER, isVoid: true },
    4:  { name: "Ladder",        col: COLLISION_TYPE.CLIMBABLE, ren: RENDER_STYLE.LADDER,       isVoid: true },
    5:  { name: "LightNode",     col: COLLISION_TYPE.NONE,      ren: RENDER_STYLE.OBJECT_MARKER, isVoid: true },
    6:  { name: "SecretWall",    col: COLLISION_TYPE.NONE,      ren: RENDER_STYLE.BLOCK_BASIC,  isSecret: true }, 
    8:  { name: "WoodPlatform",  col: COLLISION_TYPE.ONE_WAY,   ren: RENDER_STYLE.PLATFORM_WOOD, isVoid: true },
    10: { name: "DirtAlt",       col: COLLISION_TYPE.SOLID,     ren: RENDER_STYLE.BLOCK_BASIC },
    99: { name: "Spike",         col: COLLISION_TYPE.HAZARD,    ren: RENDER_STYLE.SPIKE_ROCK,   damage: 100, isVoid: true }
};

function getTileDef(id) {
    return TILE_DEF[id] || TILE_DEF[0];
}

</script>

<script>

/**
 * ============================================================================
 * 2. GAME OBJECTS (Polymorphic Entities)
 * ============================================================================
 */

class Particle {
    constructor(x, y, type = 'dust') {
        this.x = x; this.y = y;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.life = 1.0;
        this.type = type;
        
        if (type === 'splash') {
            this.vy = -rand(0.5, 2); this.vx = rand(-1, 1); this.life = rand(0.5, 1);
        } else if (type === 'spark') {
            this.vx = (Math.random() - 0.5) * 2; this.vy = (Math.random() - 0.5) * 2;
        } else if (type === 'bubble') {
            this.vy = -rand(0.5, 2.0); this.vx = rand(-0.5, 0.5); this.life = rand(0.5, 1.0);
        } else if (type === 'rubble') {
            this.vx = (Math.random() - 0.5) * 3; this.vy = -rand(1, 3); this.life = rand(0.5, 0.8);
        }
    }

    update(timeScale) {
        this.x += this.vx * timeScale;
        this.y += this.vy * timeScale;
        
        if (this.type === 'dust') {
            this.life -= 0.005 * timeScale; this.y -= 0.05 * timeScale; 
        } else if (this.type === 'splash') {
            this.vy += 0.1 * timeScale; this.life -= 0.02 * timeScale;
        } else if (this.type === 'spark') {
            this.life -= 0.03 * timeScale;
        } else if (this.type === 'bubble') {
            this.life -= 0.02 * timeScale; this.vx *= Math.pow(0.95, timeScale);
        } else if (this.type === 'rubble') {
            this.life -= 0.02 * timeScale; this.vy += 0.2 * timeScale;
        }
    }

    draw(ctx) {
        if (this.type === 'dust') ctx.fillStyle = `rgba(100, 150, 255, ${Math.max(0, this.life * 0.3)})`;
        else if (this.type === 'splash') ctx.fillStyle = `rgba(150, 200, 255, ${Math.max(0, this.life)})`;
        else if (this.type === 'spark') ctx.fillStyle = `rgba(255, 255, 150, ${Math.max(0, this.life)})`;
        else if (this.type === 'bubble') ctx.fillStyle = `rgba(200, 255, 255, ${Math.max(0, this.life * 0.6)})`;
        else if (this.type === 'rubble') ctx.fillStyle = `rgba(120, 120, 140, ${Math.max(0, this.life)})`;
        else ctx.fillStyle = `rgba(255, 255, 200, ${Math.max(0, this.life)})`;
        ctx.fillRect(this.x, this.y, 1, 1);
    }
}

class WallLight {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.baseRadius = 40;
        this.currentRadius = 40;
        this.targetRadius = 40;
    }
    update(game, timeScale) {
        const player = game.player;
        const dist = Math.hypot(player.x - (this.x + 8), player.y - (this.y + 8));
        this.targetRadius = dist < 20 ? 100 : 40;
        const k = 1 - Math.pow(0.9, timeScale);
        this.currentRadius += (this.targetRadius - this.currentRadius) * k;
    }
    draw(ctx) {
        ctx.fillStyle = COLORS.lightBase;
        ctx.fillRect(this.x + 4, this.y + 2, 8, 8);
        ctx.fillStyle = COLORS.lightGlow;
        ctx.fillRect(this.x + 6, this.y + 4, 4, 4);
        
        let lg = ctx.createRadialGradient(this.x+8, this.y+8, 2, this.x+8, this.y+8, this.currentRadius);
        lg.addColorStop(0, 'rgba(255, 220, 180, 0.4)');
        lg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = lg;
        ctx.globalCompositeOperation = 'lighter';
        ctx.beginPath(); ctx.arc(this.x+8, this.y+8, this.currentRadius, 0, Math.PI*2); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
    }
}

class Chest {
    constructor(x, y, roomKey) {
        this.x = x; this.y = y;
        this.w = TILE_SIZE; this.h = TILE_SIZE;
        this.roomKey = roomKey;
        this.abilityId = ROOM_LOOT[roomKey] || null;
        this.opened = false;
        this.glowPhase = 0;
    }
    update(game, timeScale) {
        if (this.opened) return;
        this.glowPhase += 0.1 * timeScale;
        const dist = Math.hypot(game.player.x - (this.x + this.w/2), game.player.y - (this.y + this.h/2));
        if (this.abilityId && game.system.abilities[this.abilityId]) this.opened = true;
        if (dist < 15) this.open(game);
    }
    open(game) {
        this.opened = true;
        if (this.abilityId) {
            game.system.enable(this.abilityId);
            game.spawnParticles(this.x + 8, this.y + 8, 20, 'spark');
        }
    }
    draw(ctx) {
        ctx.fillStyle = this.opened ? COLORS.chestOpen : COLORS.chestClosed;
        if (this.opened) {
            ctx.fillRect(this.x + 2, this.y + 6, 12, 10);
            ctx.fillStyle = '#000'; ctx.fillRect(this.x + 3, this.y + 6, 10, 2); 
        } else {
            ctx.fillRect(this.x + 2, this.y + 4, 12, 12);
            ctx.fillStyle = '#ffaa00'; ctx.fillRect(this.x + 7, this.y + 8, 2, 2);
            const alpha = 0.2 + Math.sin(this.glowPhase) * 0.1;
            ctx.strokeStyle = `rgba(255, 255, 170, ${alpha})`;
            ctx.strokeRect(this.x, this.y, 16, 16);
        }
    }
}

class Blade {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.h = rand(4, 8); 
        this.angle = rand(-0.2, 0.2); 
        this.baseAngle = this.angle;
        this.stiffness = rand(0.1, 0.2);
    }
    update(game, timeScale) {
        const player = game.player;
        const dist = Math.abs(this.x - player.x);
        const yDist = Math.abs(this.y - (player.y + player.r)); 
        const time = Date.now() * 0.002;
        const wind = Math.sin(time + this.x * 0.1) * 0.2;
        let force = 0;
        if (dist < (player.r + 8) && yDist < 10) force = (this.x - player.x) > 0 ? 1.5 : -1.5;
        const target = this.baseAngle + wind + force;
        const k = 1 - Math.pow(1 - this.stiffness, timeScale);
        this.angle += (target - this.angle) * k;
    }
    draw(ctx) {
        const tipX = this.x + Math.sin(this.angle) * this.h;
        const tipY = this.y - Math.cos(this.angle) * this.h;
        ctx.strokeStyle = COLORS.grass;
        ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(tipX, tipY); ctx.stroke();
        ctx.fillStyle = COLORS.grassTip; ctx.fillRect(tipX, tipY, 1, 1);
    }
}

class Flower {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.state = 0; this.bloomFactor = 0;
    }
    update(game, timeScale) {
        const dist = Math.hypot(game.player.x - this.x, game.player.y - this.y);
        if (dist < 30) this.bloomFactor += 0.05 * timeScale;
        else this.bloomFactor -= 0.02 * timeScale;
        this.bloomFactor = clamp(this.bloomFactor, 0, 1);
        if (this.bloomFactor > 0.8 && Math.random() < (0.05 * timeScale)) {
            game.spawnParticles(this.x, this.y - 10, 1, 'spark');
        }
    }
    draw(ctx) {
        ctx.fillStyle = COLORS.flowerStem;
        ctx.fillRect(this.x - 1, this.y, 2, 8);
        const size = 3 + this.bloomFactor * 2;
        ctx.fillStyle = this.bloomFactor > 0.5 ? COLORS.flowerBulbOpen : COLORS.flowerBulbClosed;
        ctx.beginPath(); ctx.arc(this.x, this.y - size, size, 0, Math.PI * 2); ctx.fill();
        if(this.bloomFactor > 0.1) {
            ctx.fillStyle = `rgba(170, 136, 255, ${this.bloomFactor})`;
            ctx.beginPath(); ctx.arc(this.x, this.y - size, 1, 0, Math.PI * 2); ctx.fill();
            ctx.globalCompositeOperation = 'lighter';
            let fg = ctx.createRadialGradient(this.x, this.y-5, 1, this.x, this.y-5, 20 * this.bloomFactor);
            fg.addColorStop(0, `rgba(180, 100, 255, ${this.bloomFactor * 0.5})`);
            fg.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = fg;
            ctx.beginPath(); ctx.arc(this.x, this.y-5, 30, 0, Math.PI*2); ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
        }
    }
}

/**
 * ============================================================================
 * 3. ENTITY FACTORY (Data -> Objects)
 * ============================================================================
 */

function spawnVegetation(map, x, y) {
    if (map.getTile(x, y - 1) === 0) {
        const count = Math.floor(rand(2, 5));
        for(let i=0; i<count; i++) {
            map.entities.push(new Blade(x * TILE_SIZE + rand(2, 14), y * TILE_SIZE));
        }
        if (Math.random() < 0.3) {
            map.entities.push(new Flower(x * TILE_SIZE + TILE_SIZE/2, y * TILE_SIZE));
        }
    }
}

const ENTITY_FACTORY = {
    3: (map, x, y, roomKey) => {
        map.entities.push(new Chest(x * TILE_SIZE, y * TILE_SIZE, roomKey));
    },
    5: (map, x, y) => {
        map.entities.push(new WallLight(x * TILE_SIZE, y * TILE_SIZE));
    },
    1: (map, x, y) => spawnVegetation(map, x, y),
    10: (map, x, y) => spawnVegetation(map, x, y),
    2: (map, x, y) => {
        if (map.getTile(x, y - 1) === 0) {
            map.waterNodes.push({x: x, y: y});
        }
    }
};

/**
 * ============================================================================
 * 4. PLAYER (Physics Engine)
 * ============================================================================
 */
class Player {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.respawnX = x; this.respawnY = y;
        this.r = 5;
        this.vx = 0; this.vy = 0;
        this.grounded = false;
        this.inWater = false;
        this.wasInWater = false;
        this.onLadder = false;
        this.squash = 1; this.stretch = 1;
        this.jumpHeld = false;
        this.floatTimer = 0;
    }

    setRespawn() { this.respawnX = this.x; this.respawnY = this.y; }

    update(game, timeScale) {
        if(game.renderer.showMap || game.isDead) return;

        const map = game.map;
        const input = game.input;
        map.checkFalseWalls(this);

        const gravity = 0.25;
        const centerTileDef = getTileDef(map.getTile(Math.floor(this.x / TILE_SIZE), Math.floor((this.y + this.r * 0.7) / TILE_SIZE)));
        this.inWater = (centerTileDef.col === COLLISION_TYPE.LIQUID);
        
        this.checkHazards(game, map);
        if(game.isDead) return;

        const ladderDef = getTileDef(map.getTile(Math.floor(this.x / TILE_SIZE), Math.floor(this.y / TILE_SIZE)));
        const touchingLadder = (ladderDef.col === COLLISION_TYPE.CLIMBABLE);

        let moveSpeed = 0.8;
        let frictionX = 0.85; 
        
        if (this.inWater) {
            moveSpeed = 0.4; frictionX = 0.9;
        }

        if (input.left) this.vx -= moveSpeed * timeScale;
        if (input.right) this.vx += moveSpeed * timeScale;

        // Ladder Logic
        if (touchingLadder && !this.inWater) {
            this.onLadder = true; this.grounded = true; this.vy = 0; this.floatTimer = 0;
            if (input.up) this.vy = -1.5;
            if (input.down) this.vy = 1.5;
            if (input.jump) {
                if (!this.jumpHeld) { this.doJump(game, -4.5); this.onLadder = false; }
            } else this.jumpHeld = false;
        } 
        // Water Logic
        else if (this.inWater) {
            this.onLadder = false;
            this.vy += gravity * timeScale; this.vy -= 0.55 * timeScale;
            if (input.down) this.vy += 0.6 * timeScale;
            if (input.jump) {
                this.floatTimer += 1.0 * timeScale;
                const bonusAccel = Math.min(this.floatTimer * 0.02, 1.5); 
                this.vy -= (0.10 + bonusAccel) * timeScale;
                if (Math.floor(this.floatTimer) % 5 === 0) game.spawnParticles(this.x, this.y + this.r, 1, 'bubble');
                this.stretch = 1.1 + Math.min(this.floatTimer * 0.01, 0.4); 
                this.squash = 1.0 - Math.min(this.floatTimer * 0.005, 0.2);
            } else { this.floatTimer = 0; }
            if (this.vy > 0) this.vy *= Math.pow(0.9, timeScale);
            else this.vy *= Math.pow(0.98, timeScale);
        } 
        // Air Logic
        else {
            this.onLadder = false; this.floatTimer = 0;
            if (input.jump) {
                if (!this.jumpHeld && this.grounded) { this.doJump(game, -4.5); }
            } else this.jumpHeld = false;
            this.vy += gravity * timeScale;
        }

        this.vx *= Math.pow(frictionX, timeScale);
        
        const maxSpeedX = this.inWater ? 1.0 : 1.6;
        const maxSpeedY = this.inWater ? 6 : 8;
        if(Math.abs(this.vx) > maxSpeedX) this.vx = maxSpeedX * Math.sign(this.vx);
        if(this.vy > maxSpeedY) this.vy = maxSpeedY; 

        this.x += this.vx * timeScale;
        this.handleCollisions(game, map, 'x', timeScale);
        
        this.y += this.vy * timeScale;
        this.grounded = false; 
        this.handleCollisions(game, map, 'y', timeScale);

        const squashK = 1 - Math.pow(0.9, timeScale);
        this.squash += (1 - this.squash) * squashK;
        this.stretch += (1 - this.stretch) * squashK;

        this.checkWaterTransitions(game, centerTileDef.col === COLLISION_TYPE.LIQUID);
        this.checkRoomTransitions(game);
    }
    
    checkHazards(game, map) {
        let startX = Math.floor((this.x - this.r) / TILE_SIZE);
        let endX = Math.floor((this.x + this.r) / TILE_SIZE);
        let startY = Math.floor((this.y - this.r) / TILE_SIZE);
        let endY = Math.floor((this.y + this.r) / TILE_SIZE);

        for (let y = startY; y <= endY; y++) {
            for (let x = startX; x <= endX; x++) {
                let tile = map.getTile(x, y);
                let def = getTileDef(tile);
                if (def.col === COLLISION_TYPE.HAZARD && !map.isSpikeDestroyed(x, y)) {
                    game.triggerDeath();
                    return;
                }
            }
        }
    }

    handleCollisions(game, map, axis, timeScale) {
        let startX = Math.floor((this.x - this.r) / TILE_SIZE);
        let endX = Math.floor((this.x + this.r) / TILE_SIZE);
        let startY = Math.floor((this.y - this.r) / TILE_SIZE);
        let endY = Math.floor((this.y + this.r) / TILE_SIZE);

        for (let y = startY; y <= endY; y++) {
            for (let x = startX; x <= endX; x++) {
                let tile = map.getTile(x, y);
                let def = getTileDef(tile);

                // Type A: One-Way Platforms
                if (def.col === COLLISION_TYPE.ONE_WAY) {
                    if (axis === 'y' && this.vy >= 0) {
                        const tileTop = y * TILE_SIZE;
                        const previousFeetY = (this.y - this.vy * timeScale) + this.r;
                        const currentFeetY = this.y + this.r;
                        if (previousFeetY <= tileTop + 0.1 && currentFeetY >= tileTop - 0.1) {
                            this.y = tileTop - this.r - 0.01;
                            this.grounded = true;
                            this.vy = 0;
                            if(this.vy > 2) { this.squash = 1.4; this.stretch = 0.6; }
                        }
                    }
                    continue; // Skip solid check
                }

                // Type B: Solid Walls
                if (def.col === COLLISION_TYPE.SOLID) { 
                    if (axis === 'x') {
                        if (this.vx > 0) this.x = x * TILE_SIZE - this.r - 0.01;
                        if (this.vx < 0) this.x = (x + 1) * TILE_SIZE + this.r + 0.01;
                        this.vx = 0;
                    } else {
                        if (this.vy > 0) { // Landing
                            this.y = y * TILE_SIZE - this.r - 0.01;
                            this.grounded = true;
                            if(this.vy > 2) { this.squash = 1.4; this.stretch = 0.6; }
                        }
                        if (this.vy < 0) { // Hitting Head
                            this.y = (y + 1) * TILE_SIZE + this.r + 0.01;
                            map.triggerTileBounce(x, y);
                            const hasMinerHat = game.system.abilities.minerHat;
                            map.processSpikeHit(x, y, hasMinerHat, game);
                        }
                        this.vy = 0;
                    }
                }
            }
        }
    }

    doJump(game, force) {
        this.vy = force; this.grounded = false; this.jumpHeld = true;
        this.stretch = 1.3; this.squash = 0.7;
        game.spawnParticles(this.x, this.y + this.r, 4, 'dust');
    }

    checkWaterTransitions(game, currentInWater) {
        if (!this.wasInWater && currentInWater) {
            if (this.vy > 1.5) {
                game.spawnParticles(this.x, this.y, 8, 'splash'); this.vy *= 0.5; 
            }
        }
        if (this.wasInWater && !currentInWater) {
            if (this.vy < -2.5) {
                game.spawnParticles(this.x, this.y + this.r, 12, 'splash');
                game.spawnParticles(this.x, this.y + this.r, 5, 'bubble');
            } else if (this.vy < 0 && this.vy > -1.0) this.vy *= 0.5;
        }
        this.wasInWater = currentInWater;
    }

    attemptSwitch(game, xOff, yOff, newX, newY) {
        if(game.loadRoom(game.map.roomX + xOff, game.map.roomY + yOff)) {
            if(newX !== null) this.x = newX;
            if(newY !== null) this.y = newY;
            this.setRespawn();
            game.spawnParticles(this.x, this.y, 10, 'dust');
            return true;
        }
        return false;
    }

    checkRoomTransitions(game) {
        if (this.x > GAME_WIDTH) {
            if (this.attemptSwitch(game, 1, 0, this.x - GAME_WIDTH, null)) {} 
            else { this.x = GAME_WIDTH; this.vx = 0; }
        } else if (this.x < 0) {
            if (this.attemptSwitch(game, -1, 0, this.x + GAME_WIDTH, null)) {} 
            else { this.x = 0; this.vx = 0; }
        }
        if (this.y > GAME_HEIGHT) {
            if (this.attemptSwitch(game, 0, 1, null, this.y - GAME_HEIGHT)) {} 
            else { this.y += GAME_HEIGHT; this.vy = 0; this.grounded = true; }
        } else if (this.y < 0) {
            if (this.attemptSwitch(game, 0, -1, null, GAME_HEIGHT)) {} 
            else { this.y = 0; this.vy = 0; }
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.squash, this.stretch);
        ctx.fillStyle = COLORS.playerCore;
        ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI*2); ctx.fill();
        if (typeof game !== 'undefined' && game.system.abilities.minerHat) {
            ctx.fillStyle = COLORS.hat; ctx.fillRect(-3, -7, 6, 3);
            ctx.fillStyle = COLORS.hatLight; ctx.fillRect(0, -7, 2, 2);
        }
        ctx.restore();
    }
}

// --- NEW: CountBounce Class for Spike Destruction Logic ---
class CountBounce {
    constructor() {
        this.reset();
    }

    reset() {
        this.start = { rx: 0, ry: 0, x: 0, y: 0 };
        this.current = { rx: 0, ry: 0, x: 0, y: 0 };
        this.count = 0;
    }

    update(hitRx, hitRy, hitX, hitY, game) {
        console.log(`CountBounce Update: Hit at Room(${hitRx},${hitRy}) Tile(${hitX},${hitY})`);
        console.log('Current State:', this);
        // 1. Logic: Is it the same start (same column, same block)?
        // If player hits a new block (different coordinate), reset sequence.
        if (!this.start || 
            this.start.rx !== hitRx || this.start.ry !== hitRy || 
            this.start.x !== hitX || this.start.y !== hitY) {
            
            this.start = { rx: hitRx, ry: hitRy, x: hitX, y: hitY };
            this.current = { rx: hitRx, ry: hitRy, x: hitX, y: hitY }; // Start one above
            this.count = 0;
            console.log(`CountBounce: New start set at Room(${hitRx},${hitRy}) Tile(${hitX},${hitY}). Count reset to 1.`);
        }

        this.current.y -= 1; // Move one tile up
        if (this.current.y < 0) {
            this.current.ry--;
            if (!WORLD_LAYOUTS[`${this.current.rx},${this.current.ry}`]) {
                console.log(`CountBounce: Hit void above at Room(${this.current.rx},${this.current.ry}). Resetting.`);
                this.reset(); return;
            }
            // const newLayout = WORLD_LAYOUTS[`${this.current.rx},${this.current.ry}`];
            this.current.y = 17; // Wrap to bottom of new room
        }        

        const tileRaw = WORLD_LAYOUTS[`${this.current.rx},${this.current.ry}`][this.current.y][this.current.x];
        const tileVal = (tileRaw === 'x') ? 99 : parseInt(tileRaw);
        const def = getTileDef(tileVal);
        
        if (def.col === COLLISION_TYPE.SOLID) { 
            // Hit a solid block (Wall/Brick). 
            // Action: Count+1 (Implicitly done by NOT resetting).
            // Visuals: Dust
            this.count++;
            game.spawnParticles(game.player.x, game.player.y, 3, 'dust');
        } else if (def.col === COLLISION_TYPE.HAZARD) { 
            // Hit a spike!
            // Action: Destroy and Reset
            const permanent = game.system.abilities.minerHat;
            
            // Check if already destroyed (sanity check)
            if (!game.map.isSpikeDestroyedExplicit(this.current.rx, this.current.ry, this.current.x, this.current.y)) {
                game.map.destroySpikeExplicit(this.current.rx, this.current.ry, this.current.x, this.current.y, permanent);
                
                // Visuals
                game.spawnParticles(game.player.x, game.player.y, 30, 'spark');
            }
            this.reset();
        } else {
            // Hit Air, Water, or other non-solid/non-hazard -> Chain Broken
            this.reset();
        }
    }
}

class Map {
    constructor() {
        this.roomX = 0; this.roomY = 0;
        this.layout = [];
        this.rows = 0; this.cols = 0;
        
        // --- UNIFIED ENTITY LIST ---
        this.entities = []; 
        this.waterNodes = [];
        
        this.visitedRooms = new Set(); 
        this.explored = {}; 
        this.visible = [];
        this.secretRegistry = {};

        this.globalDestroyedSpikes = new Set();
        this.temporaryDestroyedSpikes = new Set();
        this.bouncingTiles = {}; 
        
        // REFACTORED: Initialize CountBounce
        this.bounceCounter = new CountBounce();
    }

    load(rx, ry) {
        const key = `${rx},${ry}`;
        if (!WORLD_LAYOUTS[key]) return false; 

        // REFACTORED: Clear progress on room load
        this.bounceCounter.reset();

        this.roomX = rx; this.roomY = ry;
        this.layout = WORLD_LAYOUTS[key];
        this.rows = this.layout.length; this.cols = this.layout[0].length;
        this.visitedRooms.add(key);

        if (!this.explored[key]) this.explored[key] = Array(this.rows).fill(0).map(() => Array(this.cols).fill(false));
        this.visible = Array(this.rows).fill(0).map(() => Array(this.cols).fill(false));
        if (!this.secretRegistry[key]) this.secretRegistry[key] = new Set();

        this.temporaryDestroyedSpikes.clear(); 
        this.bouncingTiles = {};

        this.generateEntities(key);
        return true;
    }

    getTileValue(val) {
        if (val === 'x') return 99;
        return parseInt(val);
    }

    generateEntities(roomKey) {
        this.entities = [];
        this.waterNodes = [];

        for (let y = 0; y < this.rows; y++) {
            for (let x = 0; x < this.cols; x++) {
                let t = this.getTileValue(this.layout[y][x]);
                if (ENTITY_FACTORY[t]) {
                    ENTITY_FACTORY[t](this, x, y, roomKey);
                }
            }
        }
    }

    // --- REFACTORED: Spike Logic with CountBounce ---
    processSpikeHit(hitX, hitY, permanent, game) {
        // Delegate to the new class
        this.bounceCounter.update(this.roomX, this.roomY, hitX, hitY, game);
    }

    isSpikeDestroyedExplicit(rx, ry, x, y) {
        const key = `${rx},${ry},${x},${y}`;
        return this.globalDestroyedSpikes.has(key) || this.temporaryDestroyedSpikes.has(key);
    }

    destroySpikeExplicit(rx, ry, x, y, permanent) {
        const key = `${rx},${ry},${x},${y}`;
        if (permanent) {
            this.globalDestroyedSpikes.add(key);
            this.temporaryDestroyedSpikes.delete(key);
        } else {
            this.temporaryDestroyedSpikes.add(key);
        }
    }

    isSpikeDestroyed(x, y) {
        const key = `${this.roomX},${this.roomY},${x},${y}`;
        return this.globalDestroyedSpikes.has(key) || this.temporaryDestroyedSpikes.has(key);
    }

    isSpikeDestroyedAt(rx, ry, x, y) {
        return this.globalDestroyedSpikes.has(`${rx},${ry},${x},${y}`);
    }

    destroySpike(x, y, permanent = false) {
        this.destroySpikeExplicit(this.roomX, this.roomY, x, y, permanent);
    }

    triggerTileBounce(x, y) {
        this.bouncingTiles[`${x},${y}`] = -4; 
    }

    updateEntities(game, timeScale) {
        this.entities.forEach(e => e.update(game, timeScale));

        for (let key in this.bouncingTiles) {
            this.bouncingTiles[key] *= Math.pow(0.8, timeScale);
            if (Math.abs(this.bouncingTiles[key]) < 0.1) delete this.bouncingTiles[key];
        }
    }

    checkFalseWalls(player) {
        const tx = Math.floor(player.x / TILE_SIZE);
        const ty = Math.floor(player.y / TILE_SIZE);
        const key = `${this.roomX},${this.roomY}`;

        const tileDef = getTileDef(this.getTile(tx, ty));
        if (tileDef.isSecret && !this.secretRegistry[key].has(`${tx},${ty}`)) {
            const stack = [[tx, ty]];
            while(stack.length > 0) {
                const [cx, cy] = stack.pop();
                const coordKey = `${cx},${cy}`;
                if (!this.secretRegistry[key].has(coordKey)) {
                    this.secretRegistry[key].add(coordKey);
                    [[0,1], [0,-1], [1,0], [-1,0]].forEach(n => {
                        const nx = cx + n[0], ny = cy + n[1];
                        const ntDef = getTileDef(this.getTile(nx, ny));
                        if (ntDef.isSecret) stack.push([nx, ny]);
                    });
                }
            }
        }
    }

    updateVisibility(player) {
        this.visible = Array(this.rows).fill(0).map(() => Array(this.cols).fill(false));
        const key = `${this.roomX},${this.roomY}`;
        const roomExplored = this.explored[key]; 
        const px = Math.floor(player.x / TILE_SIZE);
        const py = Math.floor(player.y / TILE_SIZE);
        
        let queue = [{x: px, y: py}];
        const markVisible = (x, y) => {
            if (x >= 0 && x < this.cols && y >= 0 && y < this.rows) {
                this.visible[y][x] = true;
                if (roomExplored) roomExplored[y][x] = true;
            }
        };
        markVisible(px, py);

        while (queue.length > 0) {
            const curr = queue.shift();
            const neighbors = [{x: curr.x, y: curr.y - 1}, {x: curr.x, y: curr.y + 1}, {x: curr.x - 1, y: curr.y}, {x: curr.x + 1, y: curr.y}];

            for (let n of neighbors) {
                if (n.x < 0 || n.x >= this.cols || n.y < 0 || n.y >= this.rows) continue;
                if (this.visible[n.y][n.x]) continue;
                markVisible(n.x, n.y);
                
                const tile = this.getTileValue(this.layout[n.y][n.x]);
                const def = getTileDef(tile);
                
                if (def.col === COLLISION_TYPE.HAZARD && !this.isSpikeDestroyed(n.x, n.y)) continue;
                if (def.col === COLLISION_TYPE.SOLID) continue;
                if (def.isSecret) continue;
                
                queue.push(n);
            }
        }
    }

    getTile(x, y) {
        if (x >= 0 && x < this.cols && y >= 0 && y < this.rows) {
            return this.getTileValue(this.layout[y][x]);
        }
        let nx = x, ny = y, rx = this.roomX, ry = this.roomY;

        if (x < 0) { rx--; nx = x + this.cols; } 
        else if (x >= this.cols) { rx++; nx = x - this.cols; }
        if (y < 0) { ry--; ny = y + this.rows; } 
        else if (y >= this.rows) { ry++; ny = y - this.rows; }

        const key = `${rx},${ry}`;
        const neighborLayout = WORLD_LAYOUTS[key];
        if (neighborLayout && ny >= 0 && ny < neighborLayout.length && nx >= 0 && nx < neighborLayout[0].length) {
            return this.getTileValue(neighborLayout[ny][nx]);
        }
        return 0; 
    }

    isRevealed(x, y) {
        const key = `${this.roomX},${this.roomY}`;
        return this.secretRegistry[key] && this.secretRegistry[key].has(`${x},${y}`);
    }
}

class InputHandler {
    constructor() {
        this.keys = {
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
            w: false, s: false, a: false, d: false,
            Space: false, " ": false,
            Tab: false,
            "=": false, "+": false, "-": false, "_": false
        };
        this.initListeners();
    }
    initListeners() {
        window.addEventListener('keydown', e => { 
            if(this.keys.hasOwnProperty(e.key) || e.key === " ") {
                if(e.key === "Tab") e.preventDefault();
                this.keys[e.key] = true;
            }
        });
        window.addEventListener('keyup', e => { 
            if(this.keys.hasOwnProperty(e.key) || e.key === " ") this.keys[e.key] = false; 
        });
    }
    isPressed(key) { return this.keys[key]; }
    get up() { return this.keys.ArrowUp || this.keys.w; }
    get down() { return this.keys.ArrowDown || this.keys.s; }
    get left() { return this.keys.ArrowLeft || this.keys.a; }
    get right() { return this.keys.ArrowRight || this.keys.d; }
    get jump() { return this.keys.Space || this.keys[" "]; }
    get map() { return this.keys.Tab; }
}

class UIManager {
    constructor() {
        this.element = document.getElementById('ui-layer');
        this.timeout = null;
    }
    showMessage(text, color = 'rgba(255, 255, 255, 0.7)', duration = 200) {
        if (this.element.innerText === text && this.element.style.opacity > 0) return;
        if (this.element.innerText.includes("SYSTEM") && !text.includes("SYSTEM")) {
            if (this.element.style.opacity > 0) return;
        }
        this.element.innerText = text;
        this.element.style.color = color;
        this.element.style.opacity = 1;
        if (this.timeout) clearTimeout(this.timeout);
        if (duration > 0 && duration < 5000) {
             this.timeout = setTimeout(() => { this.element.style.opacity = 0; }, duration);
        }
    }
    showSystemMessage(text) {
        this.element.innerText = `[SYSTEM]: ${text}`;
        this.element.style.opacity = 1;
        this.element.style.color = '#aaffaa';
        if (this.timeout) clearTimeout(this.timeout);
        this.timeout = setTimeout(() => {
            this.element.style.opacity = 0;
            setTimeout(() => this.element.style.color = 'rgba(255, 255, 255, 0.7)', 500);
        }, 3000);
    }
}

<script>

class SystemManager {
    constructor(ui) {
        this.ui = ui;
        this.abilities = { minimap: false, minerHat: false };
    }
    enable(abilityName) {
        if (this.abilities.hasOwnProperty(abilityName)) {
            this.abilities[abilityName] = true;
            this.ui.showSystemMessage(`${abilityName.toUpperCase()} MODULE INSTALLED`);
        }
    }
}

class BackgroundLayer {
    constructor() {}
    draw(ctx, game, timeScale) {
        ctx.fillStyle = '#0d0d1a';
        ctx.fillRect(80, 0, 10, GAME_HEIGHT);
        ctx.fillRect(220, 0, 15, GAME_HEIGHT);
        ctx.strokeStyle = '#1a1a2e';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(100, 0); ctx.lineTo(100, 60);
        ctx.moveTo(110, 0); ctx.lineTo(110, 40);
        ctx.moveTo(250, 0); ctx.lineTo(250, 90);
        ctx.stroke();
        if (game.scripts.currentScript && game.scripts.currentScript.drawBackground) {
            game.scripts.currentScript.drawBackground(ctx, game, timeScale);
        }
    }
}

class GameRenderer {
    constructor(canvas, ui) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d', { alpha: false });
        this.ui = ui;
        this.canvas.width = GAME_WIDTH; this.canvas.height = GAME_HEIGHT;
        this.canvas.style.width = `${GAME_WIDTH * SCALE}px`;
        this.canvas.style.height = `${GAME_HEIGHT * SCALE}px`;
        this.backgroundLayer = new BackgroundLayer();
        this.showMap = false;
        this.mapScale = 3.0;
        this.mapOffsetX = 0; this.mapOffsetY = 0;
        this.worldBounds = this.calculateWorldBounds();
    }

    calculateWorldBounds() {
        const keys = Object.keys(WORLD_LAYOUTS);
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        keys.forEach(k => {
            const [x, y] = k.split(',').map(Number);
            if(x < minX) minX = x; if(x > maxX) maxX = x;
            if(y < minY) minY = y; if(y > maxY) maxY = y;
        });
        return { minX, maxX, minY, maxY };
    }

    handleMapInput(game) {
        const input = game.input;
        const system = game.system;
        const map = game.map;

        if (input.keys["Tab"]) {
            if(!this.tabHeld) {
                if (system.abilities.minimap) {
                    this.showMap = !this.showMap;
                    if(this.showMap) { 
                        const b = this.worldBounds;
                        const gridW = (b.maxX - b.minX + 1); const gridH = (b.maxY - b.minY + 1);
                        const centerGridX = b.minX + (gridW - 1) / 2;
                        const centerGridY = b.minY + (gridH - 1) / 2;
                        const pixelSize = this.mapScale;
                        const roomPixW = 30 * pixelSize; const roomPixH = 18 * pixelSize;
                        this.mapOffsetX = (centerGridX - map.roomX) * roomPixW;
                        this.mapOffsetY = (centerGridY - map.roomY) * roomPixH;
                        this.clampMapCamera(); 
                    }
                } else { this.ui.showSystemMessage("MAP MODULE NOT FOUND"); }
                this.tabHeld = true;
            }
        } else { this.tabHeld = false; }

        if (this.showMap) {
            const zoomSpeed = 0.05; const panSpeed = 3;
            if(input.keys["="] || input.keys["+"]) this.mapScale = Math.min(this.mapScale + zoomSpeed, 5.0);
            if(input.keys["-"] || input.keys["_"]) this.mapScale = Math.max(this.mapScale - zoomSpeed, 0.5); 
            if(input.up) this.mapOffsetY += panSpeed;
            if(input.down) this.mapOffsetY -= panSpeed;
            if(input.left) this.mapOffsetX += panSpeed;
            if(input.right) this.mapOffsetX -= panSpeed;
            this.clampMapCamera();
        }
    }

    clampMapCamera() {
        const b = this.worldBounds;
        const gridW = (b.maxX - b.minX + 1);
        const gridH = (b.maxY - b.minY + 1);
        const pixelSize = this.mapScale;
        const roomPixW = 30 * pixelSize; 
        const roomPixH = 18 * pixelSize;
        const totalMapW = gridW * roomPixW;
        const totalMapH = gridH * roomPixH;
        const viewportW = 400; const viewportH = 240;
        let maxOffX = 0; let maxOffY = 0;
        if (totalMapW > viewportW) maxOffX = (totalMapW - viewportW) / 2;
        if (totalMapH > viewportH) maxOffY = (totalMapH - viewportH) / 2;
        this.mapOffsetX = clamp(this.mapOffsetX, -maxOffX, maxOffX);
        this.mapOffsetY = clamp(this.mapOffsetY, -maxOffY, maxOffY);
    }

    draw(game, accumulatedTime, timeScale) {
        this.ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        this.ctx.fillStyle = COLORS.bg;
        this.ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        this.backgroundLayer.draw(this.ctx, game);
        this.drawFog(game.map);
        this.drawMapTiles(game.map, accumulatedTime);
        
        // --- NEW: Universal Entity Draw ---
        this.drawEntities(game.map);

        game.player.draw(this.ctx);
        this.drawParticles(game);
        this.drawLighting(game); // Draw light overlays (Player glow, etc)

        if (game.scripts.currentScript && game.scripts.currentScript.drawForeground) {
            game.scripts.currentScript.drawForeground(this.ctx, game, timeScale);
        }
        this.drawPostEffects(game);
        if(this.showMap) this.drawMinimap(game);
    }

    drawFog(map) {
        this.ctx.fillStyle = COLORS.bg;
        for (let y = 0; y < map.rows; y++) {
            for (let x = 0; x < map.cols; x++) {
                if (!map.visible || !map.visible[y][x]) {
                    this.ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                }
            }
        }
    }

    drawPostEffects(game) {
        if (game.isDead || game.recoveryTimer > 0) {
            let mosaicFactor = 0;
            if (game.isDead) mosaicFactor = Math.min(1, game.deathTimer / 1000);
            else mosaicFactor = Math.max(0, game.recoveryTimer / 1000);

            if (mosaicFactor > 0) {
                const mosaicLevel = Math.max(1, Math.floor(mosaicFactor * 20));
                const w = this.canvas.width; const h = this.canvas.height;
                this.ctx.imageSmoothingEnabled = false;
                this.ctx.drawImage(this.canvas, 0, 0, w, h, 0, 0, w / mosaicLevel, h / mosaicLevel);
                this.ctx.drawImage(this.canvas, 0, 0, w / mosaicLevel, h / mosaicLevel, 0, 0, w, h);
                this.ctx.fillStyle = `rgba(50, 0, 0, ${mosaicFactor * 0.5})`;
                this.ctx.fillRect(0, 0, w, h);
            }
        }
    }

    // --- REFACTORED: Delegated Map Drawing ---
    drawMapTiles(map, accumulatedTime) {
        for (let y = 0; y < map.rows; y++) {
            for (let x = 0; x < map.cols; x++) {
                if (!map.visible || !map.visible[y][x]) continue;

                // FIX: Use getTileValue to convert raw layout ('x') to ID (99)
                const tileId = map.getTileValue(map.layout[y][x]);
                const def = getTileDef(tileId);
                const tx = x * TILE_SIZE;
                const ty = y * TILE_SIZE;
                const bounceOff = map.bouncingTiles[`${x},${y}`] || 0;

                // --- Render Delegation Switch ---
                switch (def.ren) {
                    case RENDER_STYLE.BLOCK_BASIC:
                        this.drawBasicBlock(tx, ty, bounceOff, x, y, map, def.isSecret);
                        break;
                    case RENDER_STYLE.LIQUID:
                        this.ctx.fillStyle = COLORS.waterBase;
                        this.ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
                        break;
                    case RENDER_STYLE.LADDER:
                        this.drawLadder(tx, ty);
                        break;
                    case RENDER_STYLE.PLATFORM_WOOD:
                        this.drawWoodPlatform(tx, ty, x, y, map);
                        break;
                    case RENDER_STYLE.SPIKE_ROCK:
                        if (!map.isSpikeDestroyed(x, y)) {
                            this.drawSpike(tx, ty, x, y);
                        }
                        break;
                    case RENDER_STYLE.INVISIBLE:
                    case RENDER_STYLE.OBJECT_MARKER:
                        break;
                }
            }
        }
        this.drawWaterSurface(map, accumulatedTime);
    }

    // --- NEW: Universal Entity Drawer ---
    drawEntities(map) {
        map.entities.forEach(entity => {
            const tx = Math.floor(entity.x / TILE_SIZE);
            const ty = Math.floor(entity.y / TILE_SIZE);
            // Culling Check
            if (map.visible && map.visible[ty] && map.visible[ty][tx]) {
                entity.draw(this.ctx);
            }
        });
    }

    // --- Drawing Subroutines ---
    drawBasicBlock(tx, ty, bounceOff, x, y, map, isSecret) {
        this.ctx.save();
        if (bounceOff !== 0) this.ctx.translate(0, bounceOff);
        if (isSecret && map.isRevealed(x, y)) this.ctx.globalAlpha = 0.4;

        this.ctx.fillStyle = COLORS.tileDark;
        this.ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
        
        if ((x + y) % 2 === 0) {
            this.ctx.fillStyle = COLORS.tileLight;
            this.ctx.fillRect(tx + 2, ty + 2, 4, 4);
            this.ctx.fillRect(tx + 8, ty + 8, 2, 2);
            this.ctx.fillRect(tx + 12, ty + 4, 2, 2);
        }

        this.ctx.fillStyle = COLORS.tileHighlight;
        const edgeW = 2;
        const isRegionInside = (nx, ny) => {
            if (nx < 0 || nx >= map.cols || ny < 0 || ny >= map.rows) return false;
            if (!map.visible[ny][nx]) return false;
            const ntDef = getTileDef(map.layout[ny][nx]);
            
            // --- FIX 2 & 3: Check `isVoid` property ---
            // Draw edge if neighbor is visually "Void" AND visually OPEN (Not Secret)
            return ntDef.isVoid && !ntDef.isSecret;
        };

        if (isRegionInside(x, y - 1)) this.ctx.fillRect(tx, ty, TILE_SIZE, edgeW);
        if (isRegionInside(x, y + 1)) this.ctx.fillRect(tx, ty + TILE_SIZE - edgeW, TILE_SIZE, edgeW);
        if (isRegionInside(x - 1, y)) this.ctx.fillRect(tx, ty, edgeW, TILE_SIZE);
        if (isRegionInside(x + 1, y)) this.ctx.fillRect(tx + TILE_SIZE - edgeW, ty, edgeW, TILE_SIZE);
        this.ctx.restore();
    }

    drawLadder(tx, ty) {
        this.ctx.fillStyle = COLORS.ladder;
        this.ctx.fillRect(tx + 4, ty, 2, TILE_SIZE);
        this.ctx.fillRect(tx + 10, ty, 2, TILE_SIZE);
        for(let i=2; i<TILE_SIZE; i+=5) this.ctx.fillRect(tx + 4, ty + i, 8, 1);
    }

    // --- REFACTORED: Better Wood Platform Visuals ---
    drawWoodPlatform(tx, ty, x, y, map) {
        // Redesigned: Thin top plane (3px), spaced beams underneath
        this.ctx.fillStyle = COLORS.woodLight; 
        this.ctx.fillRect(tx, ty, TILE_SIZE, 3);
        
        // Spaced beams (dots)
        this.ctx.fillStyle = COLORS.woodDark;
        this.ctx.fillRect(tx + 2, ty + 3, 2, 2);
        this.ctx.fillRect(tx + 8, ty + 3, 2, 2);
        this.ctx.fillRect(tx + 12, ty + 3, 2, 2);

        // Smart Supports: Only connect to Solid blocks (not other platforms)
        const leftDef = getTileDef(map.getTile(x - 1, y));
        const rightDef = getTileDef(map.getTile(x + 1, y));
        
        this.ctx.fillStyle = COLORS.woodDetail; 

        // Left Support: Diagonal brace towards wall
        if (leftDef.col === COLLISION_TYPE.SOLID) {
            this.ctx.beginPath();
            this.ctx.moveTo(tx, ty + 3);
            this.ctx.lineTo(tx, ty + 10);      // Down wall
            this.ctx.lineTo(tx + 7, ty + 3);    // Out on platform
            this.ctx.fill();
        }

        // Right Support: Diagonal brace towards wall
        if (rightDef.col === COLLISION_TYPE.SOLID) {
            this.ctx.beginPath();
            this.ctx.moveTo(tx + 16, ty + 3);
            this.ctx.lineTo(tx + 16, ty + 10);  // Down wall
            this.ctx.lineTo(tx + 9, ty + 3);    // Out on platform
            this.ctx.fill();
        }
    }

    drawSpike(tx, ty, x, y) {
        const seed = (x * 37 + y * 13) % 100;
        this.ctx.fillStyle = COLORS.spike;
        this.ctx.beginPath();
        this.ctx.moveTo(tx + 2, ty + TILE_SIZE);
        this.ctx.lineTo(tx + 4 + (seed % 4), ty + 2 + (seed % 6)); 
        this.ctx.lineTo(tx + 10, ty + TILE_SIZE);
        this.ctx.lineTo(tx + 14, ty + TILE_SIZE);
        this.ctx.lineTo(tx + 12, ty + 6 + (seed % 4));
        this.ctx.lineTo(tx + 8, ty + TILE_SIZE);
        this.ctx.fill();
        this.ctx.fillStyle = COLORS.spikeDark;
        this.ctx.beginPath();
        this.ctx.moveTo(tx + 4 + (seed % 4), ty + 2 + (seed % 6));
        this.ctx.lineTo(tx + 5 + (seed % 4), ty + TILE_SIZE);
        this.ctx.lineTo(tx + 3 + (seed % 4), ty + TILE_SIZE);
        this.ctx.fill();
    }

    drawWaterSurface(map, accumulatedTime) {
        this.ctx.fillStyle = COLORS.waterSurface;
        this.ctx.beginPath();
        map.waterNodes.forEach(node => {
            if (map.visible && map.visible[node.y][node.x]) {
                let wx = node.x * TILE_SIZE;
                let wy = node.y * TILE_SIZE + 4;
                for(let i=0; i<=TILE_SIZE; i+=4) {
                    let h = Math.sin(accumulatedTime * 0.005 + node.x + i * 0.2) * 2;
                    this.ctx.rect(wx + i, wy + h, 4, 2);
                }
            }
        });
        this.ctx.fill();
    }

    drawParticles(game) {
        game.particles.forEach(p => {
            const tx = Math.floor(p.x / TILE_SIZE);
            const ty = Math.floor(p.y / TILE_SIZE);
            if (game.map.visible && game.map.visible[ty] && game.map.visible[ty][tx]) {
                p.draw(this.ctx);
            }
        });
    }

    drawLighting(game) {
        if (game.isDead) return;
        this.ctx.fillStyle = 'rgba(5, 5, 10, 0.3)';
        this.ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        this.ctx.globalCompositeOperation = 'lighter';
        
        let g = this.ctx.createRadialGradient(game.player.x, game.player.y, 2, game.player.x, game.player.y, 40);
        g.addColorStop(0, 'rgba(100, 255, 150, 0.3)');
        g.addColorStop(1, 'rgba(0, 0, 0, 0)');
        this.ctx.fillStyle = g;
        this.ctx.beginPath(); this.ctx.arc(game.player.x, game.player.y, 40, 0, Math.PI*2); this.ctx.fill();

        this.ctx.globalCompositeOperation = 'source-over';
    }

    drawMinimap(game) {
        const map = game.map;
        const b = this.worldBounds;
        this.ctx.fillStyle = COLORS.mapBg;
        const mapW = 400; const mapH = 240;
        const mapX = (GAME_WIDTH - mapW) / 2;
        const mapY = (GAME_HEIGHT - mapH) / 2;
        this.ctx.fillRect(mapX, mapY, mapW, mapH);
        
        this.ctx.save();
        this.ctx.beginPath();
        this.ctx.rect(mapX, mapY, mapW, mapH);
        this.ctx.clip();
        this.ctx.fillStyle = "#fff";
        this.ctx.font = "10px monospace";
        this.ctx.textAlign = "center";
        this.ctx.fillText(`SYSTEM MAP [+/- Zoom] [Arrows Pan]`, GAME_WIDTH/2, mapY + 15);
        this.ctx.textAlign = "left"; 

        const pixelSize = this.mapScale; 
        const roomPixW = 30 * pixelSize; const roomPixH = 18 * pixelSize;
        const gridW = (b.maxX - b.minX + 1); const gridH = (b.maxY - b.minY + 1);
        const viewCX = mapX + mapW/2; const viewCY = mapY + mapH/2;

        for(let rY = b.minY; rY <= b.maxY; rY++) {
            for(let rX = b.minX; rX <= b.maxX; rX++) {
                const key = `${rX},${rY}`;
                const distX = rX - (b.minX + (gridW - 1)/2); 
                const distY = rY - (b.minY + (gridH - 1)/2);
                const dx = viewCX + this.mapOffsetX + distX * roomPixW - (roomPixW/2);
                const dy = viewCY + this.mapOffsetY + distY * roomPixH - (roomPixH/2);

                if (dx + roomPixW < mapX || dx > mapX + mapW || dy + roomPixH < mapY || dy > mapY + mapH) continue;

                if (map.explored[key]) {
                    const layout = WORLD_LAYOUTS[key];
                    const exploredData = map.explored[key];
                    const baseColor = (rX === 0 && rY === 0) ? '#222233' : '#111116';
                    if (layout) {
                        this.ctx.fillStyle = baseColor;
                        this.ctx.fillRect(dx, dy, roomPixW, roomPixH);
                        for (let r = 0; r < layout.length; r++) {     
                            for (let c = 0; c < layout[r].length; c++) { 
                                if (exploredData[r][c]) {
                                    const tile = map.getTileValue(layout[r][c]);
                                    if (tile !== 0) {
                                        const def = getTileDef(tile);
                                        const isSecretRevealed = map.secretRegistry[key] && map.secretRegistry[key].has(`${c},${r}`);

                                        // --- FIX 1: Minimap now checks for Secret Walls (even if not Solid) ---
                                        if (def.col === COLLISION_TYPE.SOLID || def.isSecret) {
                                            if (def.isSecret && isSecretRevealed) {
                                                 continue; // If revealed, show as empty space (or draw background)
                                            }
                                            // Draw as normal wall
                                            this.ctx.fillStyle = COLORS.mapWall;
                                        }
                                        else if (def.col === COLLISION_TYPE.LIQUID) this.ctx.fillStyle = COLORS.mapWater;
                                        else if (def.col === COLLISION_TYPE.CLIMBABLE) this.ctx.fillStyle = COLORS.ladder;
                                        else if (def.col === COLLISION_TYPE.ONE_WAY) this.ctx.fillStyle = COLORS.woodDark;
                                        else if (def.col === COLLISION_TYPE.HAZARD) {
                                            if (map.isSpikeDestroyedAt(rX, rY, c, r)) continue; 
                                            this.ctx.fillStyle = "#ff0000"; 
                                        }
                                        else if (def.ren === RENDER_STYLE.OBJECT_MARKER) {
                                            // Chest logic for minimap color
                                            if (tile === 3) this.ctx.fillStyle = COLORS.chestClosed;
                                            else this.ctx.fillStyle = COLORS.lightGlow;
                                        }
                                        else continue;
                                        this.ctx.fillRect(dx + c * pixelSize, dy + r * pixelSize, pixelSize, pixelSize);
                                    }
                                }
                            }
                        }
                    }
                    if (rX === map.roomX && rY === map.roomY) {
                        this.ctx.strokeStyle = COLORS.playerGlow;
                        this.ctx.lineWidth = 1;
                        this.ctx.strokeRect(dx - 1, dy - 1, roomPixW + 2, roomPixH + 2);
                        const px = (game.player.x / TILE_SIZE) * pixelSize;
                        const py = (game.player.y / TILE_SIZE) * pixelSize;
                        this.ctx.fillStyle = '#fff';
                        this.ctx.fillRect(dx + px, dy + py, 2, 2);
                    }
                } 
            }
        }
        this.ctx.restore();
    }
}

class Game {
    constructor() {
        this.input = new InputHandler();
        this.ui = new UIManager();
        this.system = new SystemManager(this.ui);
        this.renderer = new GameRenderer(document.getElementById('gameCanvas'), this.ui);
        this.scripts = new ScriptManager();
        this.map = new Map();
        // this.player = new Player(900, 890); 
        this.player = new Player(55, 150);
        this.particles = [];
        this.isDead = false;
        this.deathTimer = 0;
        this.recoveryTimer = 0; 
        this.lastTime = 0;
        this.accumulatedTime = 0;
        this.loadRoom(0, 0);
    }

    loadRoom(rx, ry) {
        if(this.map.load(rx, ry)) {
            this.scripts.onRoomEnter(this, rx, ry);
            return true;
        }
        return false;
    }

    spawnParticles(x, y, count, type) {
        for(let i=0; i<count; i++) this.particles.push(new Particle(x, y, type));
    }

    triggerDeath() {
        if (this.isDead) return;
        this.isDead = true;
        this.deathTimer = 0;
        this.recoveryTimer = 0;
        this.spawnParticles(this.player.x, this.player.y, 20, 'spark');
    }

    respawn() {
        this.isDead = false;
        this.recoveryTimer = 1000; 
        this.player.x = this.player.respawnX;
        this.player.y = this.player.respawnY;
        this.player.vx = 0; this.player.vy = 0;
        this.map.temporaryDestroyedSpikes.clear();
        this.spawnParticles(this.player.x, this.player.y, 10, 'dust');
    }

    loop(timestamp) {
        if (!this.lastTime) this.lastTime = timestamp;
        const deltaTime = timestamp - this.lastTime;
        this.lastTime = timestamp;
        const TARGET_FPS = 60;
        const timeScale = Math.min(deltaTime / (1000 / TARGET_FPS), 4.0);
        this.accumulatedTime += deltaTime;

        this.renderer.handleMapInput(this);

        if (this.isDead) {
            this.deathTimer += deltaTime;
            if (this.deathTimer > 1000) { this.respawn(); }
        } else {
            if (this.recoveryTimer > 0) {
                this.recoveryTimer -= deltaTime;
                if(this.recoveryTimer < 0) this.recoveryTimer = 0;
            }

            this.player.update(this, timeScale);
            this.map.updateEntities(this, timeScale);
            this.map.updateVisibility(this.player);
            this.scripts.update(this, timeScale); 
            
            if(Math.random() < (0.1 * timeScale)) this.spawnParticles(rand(0, GAME_WIDTH), rand(0, GAME_HEIGHT), 1, 'dust');
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
            this.particles[i].update(timeScale);
            if (this.particles[i].life <= 0) this.particles.splice(i, 1);
        }

        this.renderer.draw(this, this.accumulatedTime, timeScale);
        requestAnimationFrame((t) => game.loop(t));
    }
}

const game = new Game();
requestAnimationFrame((t) => game.loop(t));
